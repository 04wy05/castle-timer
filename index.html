<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Rally Radar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #121212; color: #fff; padding: 12px; margin: 0; }
  
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; flex-wrap: wrap; gap: 10px; }
  .utc-label { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .utc-clock { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 1px; }

  .global-actions { display: flex; gap: 8px; }
  .btn-global { border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: #fff; }
  .btn-global-copy { background: #2e7d32; }
  .btn-global-copy:hover { background: #388e3c; }
  .btn-global-copy.copied { background: #1565c0; }
  .btn-global-reset { background: #424242; }
  .btn-global-reset:hover { background: #616161; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 12px; }
  .lane-card { background: #1e1e1e; border-radius: 10px; border: 1px solid #333; padding: 14px; position: relative; }
  .lane-card.danger { border-color: #ff3d00; background: #261414; }

  .lane-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-title span { font-weight: bold; font-size: 15px; color: #ffb74d; }

  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #bbb; }
  .input-row input { height: 32px; font-size: 15px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }
  .input-leader { width: 150px; padding: 0 8px; text-align: left; }
  .input-num { width: 55px; text-align: center; }

  .output-box { margin-top: 12px; padding: 10px; background: #111; border-radius: 6px; text-align: center; border: 1px dashed #444; }
  .hit-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .hit-utc { font-size: 24px; font-weight: bold; color: #ff5252; letter-spacing: 1px; margin: 2px 0; }
  .countdown { font-size: 15px; color: #ffeb3b; margin-top: 4px; font-weight: bold; }
  .status-idle { color: #666; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="utc-label">Server Time (UTC)</div>
    <div class="utc-clock" id="clock">--:--:--</div>
  </div>
  <div class="global-actions">
    <button class="btn-global btn-global-copy" id="btnCopyAll" onclick="copyAllOutcomes()">📋 Copy All Outcomes</button>
    <button class="btn-global btn-global-reset" onclick="resetAllTimers()">🔄 Reset Timers</button>
  </div>
</div>

<div class="lanes">
  <!-- Lane 1 -->
  <div class="lane-card" id="card-0">
    <div class="lane-title">
      <span>🎯 RALLY 1</span>
    </div>
    <div class="input-row">
      <label>Rally Leader:</label>
      <input type="text" class="input-leader" id="leader-0" placeholder="e.g. BossA" oninput="recalc(0)">
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" class="input-num" id="waitM-0" placeholder="m" min="0" oninput="recalc(0)"> m
        <input type="number" class="input-num" id="waitS-0" placeholder="s" min="0" max="59" oninput="recalc(0)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" class="input-num" id="marchS-0" placeholder="s" value="45" min="0" oninput="recalc(0)"> s
      </div>
    </div>
    <div class="output-box" id="out-0">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>

  <!-- Lane 2 -->
  <div class="lane-card" id="card-1">
    <div class="lane-title">
      <span>🎯 RALLY 2</span>
    </div>
    <div class="input-row">
      <label>Rally Leader:</label>
      <input type="text" class="input-leader" id="leader-1" placeholder="e.g. BossB" oninput="recalc(1)">
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" class="input-num" id="waitM-1" placeholder="m" min="0" oninput="recalc(1)"> m
        <input type="number" class="input-num" id="waitS-1" placeholder="s" min="0" max="59" oninput="recalc(1)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" class="input-num" id="marchS-1" placeholder="s" value="45" min="0" oninput="recalc(1)"> s
      </div>
    </div>
    <div class="output-box" id="out-1">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>

  <!-- Lane 3 -->
  <div class="lane-card" id="card-2">
    <div class="lane-title">
      <span>🎯 RALLY 3</span>
    </div>
    <div class="input-row">
      <label>Rally Leader:</label>
      <input type="text" class="input-leader" id="leader-2" placeholder="e.g. BossC" oninput="recalc(2)">
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" class="input-num" id="waitM-2" placeholder="m" min="0" oninput="recalc(2)"> m
        <input type="number" class="input-num" id="waitS-2" placeholder="s" min="0" max="59" oninput="recalc(2)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" class="input-num" id="marchS-2" placeholder="s" value="45" min="0" oninput="recalc(2)"> s
      </div>
    </div>
    <div class="output-box" id="out-2">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

const targets = [null, null, null];

function updateClock() {
  const now = new Date();
  const h = pad(now.getUTCHours());
  const m = pad(now.getUTCMinutes());
  const s = pad(now.getUTCSeconds());
  const clockEl = document.getElementById('clock');
  if (clockEl) {
    clockEl.innerText = `${h}:${m}:${s}`; }  for (let i = 0; i < 3; i++) { renderOutput(i, now.getTime()); } } setInterval(updateClock, 1000); updateClock();  function recalc(i) { const waitM = parseInt(document.getElementById(`waitM-${i}`).value) || 0;
  const waitS = parseInt(document.getElementById(`waitS-${i}`).value) \vert{}\vert{} 0; const marchS = parseInt(document.getElementById(`marchS-${i}`).value) || 0;

  const rawM = document.getElementById(`waitM-${i}`).value.trim(); const rawS = document.getElementById(`waitS-${i}`).value.trim();

  // 只有当有时间输入时才开始计算
  if (rawM === '' && rawS === '') {
    targets[i] = null;
  } else {
    const totalSec = waitM * 60 + waitS + marchS;
    targets[i] = Date.now() + totalSec * 1000;
  }
  renderOutput(i, Date.now());
}

function renderOutput(i, nowTime) {
  const out = document.getElementById(`out-${i}`); const card = document.getElementById(`card-${i}`);
  if (!out || !card) return;
  const target = targets[i];

  if (!target) {
    out.innerHTML = `<div class="status-idle">Awaiting time input...</div>`;
    card.classList.remove('danger');
    return;
  }

  const diffSec = Math.round((target - nowTime) / 1000);
  const targetDate = new Date(target);
  const tStr = `${pad(targetDate.getUTCHours())}:${pad(targetDate.getUTCMinutes())}:${pad(targetDate.getUTCSeconds())}`;

  if (diffSec <= 0) {
    out.innerHTML = `<div style="color:#ff5252; font-weight:bold; font-size:16px;">💥 HIT CASTLE (${tStr})</div>`;
    card.classList.remove('danger');
  } else {
    if (diffSec <= 15) {
      card.classList.add('danger');
    } else {
      card.classList.remove('danger');
    }
    out.innerHTML = `
      <div class="hit-label">Hits Castle (UTC)</div>
      <div class="hit-utc">${tStr}</div>
      <div class="countdown">${diffSec}s remaining</div>
    `;
  }
}

// 只重置 3 个窗口的等待时间，保留名字与固定行军耗时
function resetAllTimers() {
  for (let i = 0; i < 3; i++) {
    document.getElementById(`waitM-${i}`).value = '';
    document.getElementById(`waitS-${i}`).value = '';
    targets[i] = null;
    renderOutput(i, Date.now());
  }
}

// 一键复制所有正在监控的集结结果
function copyAllOutcomes() {
  const lines = [];

  for (let i = 0; i < 3; i++) {
    const target = targets[i];
    if (target) {
      const leaderName = document.getElementById(`leader-${i}`).value.trim() || `Rally ${i+1}`;
      const targetDate = new Date(target);
      const tStr = `${pad(targetDate.getUTCHours())}:${pad(targetDate.getUTCMinutes())}:${pad(targetDate.getUTCSeconds())}`;
      lines.push(`[${leaderName}] Hits Castle at UTC ${tStr}`);
    }
  }

  if (lines.length === 0) return;

  const textToCopy = lines.join('\n');
  navigator.clipboard.writeText(textToCopy).then(() => {
    const btn = document.getElementById('btnCopyAll');
    btn.innerText = '✅ Copied All!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerText = '📋 Copy All Outcomes';
      btn.classList.remove('copied');
    }, 2000);
  });
}
</script>
</body>
</html>
