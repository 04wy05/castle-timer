<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Rally Radar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #121212; color: #fff; padding: 12px; margin: 0; }
  
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
  .utc-label { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .utc-clock { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 1px; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .lane-card { background: #1e1e1e; border-radius: 10px; border: 1px solid #333; padding: 14px; position: relative; }
  .lane-card.danger { border-color: #ff3d00; background: #261414; }

  .lane-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .lane-title span { font-weight: bold; font-size: 15px; color: #ffb74d; }
  .btn-clear { background: #424242; border: none; color: #bbb; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #bbb; }
  .input-row input { width: 60px; height: 32px; font-size: 16px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }

  .output-box { margin-top: 12px; padding: 10px; background: #111; border-radius: 6px; text-align: center; border: 1px dashed #444; }
  .hit-utc { font-size: 24px; font-weight: bold; color: #ff5252; letter-spacing: 1px; }
  .countdown { font-size: 15px; color: #ffeb3b; margin-top: 4px; font-weight: bold; }
  .status-idle { color: #666; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="utc-label">Server Time (UTC)</div>
    <div class="utc-clock" id="clock">--:--:--</div>
  </div>
  <div style="font-size: 11px; color: #888;">Auto-calculates on input</div>
</div>

<div class="lanes">
  <!-- Lane 1 -->
  <div class="lane-card" id="card-0">
    <div class="lane-title">
      <span>🎯 RALLY 1</span>
      <button class="btn-clear" onclick="clearLane(0)">Reset</button>
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" id="waitM-0" placeholder="m" min="0" oninput="recalc(0)"> m
        <input type="number" id="waitS-0" placeholder="s" min="0" max="59" oninput="recalc(0)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" id="marchS-0" placeholder="s" value="45" min="0" oninput="recalc(0)"> s
      </div>
    </div>
    <div class="output-box" id="out-0">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>

  <!-- Lane 2 -->
  <div class="lane-card" id="card-1">
    <div class="lane-title">
      <span>🎯 RALLY 2</span>
      <button class="btn-clear" onclick="clearLane(1)">Reset</button>
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" id="waitM-1" placeholder="m" min="0" oninput="recalc(1)"> m
        <input type="number" id="waitS-1" placeholder="s" min="0" max="59" oninput="recalc(1)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" id="marchS-1" placeholder="s" value="45" min="0" oninput="recalc(1)"> s
      </div>
    </div>
    <div class="output-box" id="out-1">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>

  <!-- Lane 3 -->
  <div class="lane-card" id="card-2">
    <div class="lane-title">
      <span>🎯 RALLY 3</span>
      <button class="btn-clear" onclick="clearLane(2)">Reset</button>
    </div>
    <div class="input-row">
      <label>Rally Timer (Waiting):</label>
      <div>
        <input type="number" id="waitM-2" placeholder="m" min="0" oninput="recalc(2)"> m
        <input type="number" id="waitS-2" placeholder="s" min="0" max="59" oninput="recalc(2)"> s
      </div>
    </div>
    <div class="input-row">
      <label>March Duration:</label>
      <div>
        <input type="number" id="marchS-2" placeholder="s" value="45" min="0" oninput="recalc(2)"> s
      </div>
    </div>
    <div class="output-box" id="out-2">
      <div class="status-idle">Awaiting time input...</div>
    </div>
  </div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

const targets = [null, null, null];

function updateClock() {
  const now = new Date();
  const h = pad(now.getUTCHours());
  const m = pad(now.getUTCMinutes());
  const s = pad(now.getUTCSeconds());
  const clockEl = document.getElementById('clock');
  if (clockEl) {
    clockEl.innerText = `${h}:${m}:${s}`;
  }

  for (let i = 0; i < 3; i++) {
    renderOutput(i, now.getTime());
  }
}
setInterval(updateClock, 1000);
updateClock();

function recalc(i) {
  const waitM = parseInt(document.getElementById(`waitM-${i}`).value) || 0;
  const waitS = parseInt(document.getElementById(`waitS-${i}`).value) || 0;
  const marchS = parseInt(document.getElementById(`marchS-${i}`).value) || 0;

  const totalSec = waitM * 60 + waitS + marchS;
  if (totalSec <= 0) {
    targets[i] = null;
  } else {
    targets[i] = Date.now() + totalSec * 1000;
  }
  renderOutput(i, Date.now());
}

function renderOutput(i, nowTime) {
  const out = document.getElementById(`out-${i}`);
  const card = document.getElementById(`card-${i}`);
  if (!out || !card) return;
  const target = targets[i];

  if (!target) {
    out.innerHTML = `<div class="status-idle">Awaiting time input...</div>`;
    card.classList.remove('danger');
    return;
  }

  const diffSec = Math.round((target - nowTime) / 1000);
  const targetDate = new Date(target);
  const tStr = `${pad(targetDate.getUTCHours())}:${pad(targetDate.getUTCMinutes())}:${pad(targetDate.getUTCSeconds())}`;

  if (diffSec <= 0) {
    out.innerHTML = `<div style="color:#ff5252; font-weight:bold; font-size:16px;">💥 HIT TARGET (${tStr})</div>`;
    card.classList.remove('danger');
  } else {
    if (diffSec <= 15) {
      card.classList.add('danger');
    } else {
      card.classList.remove('danger');
    }
    out.innerHTML = `
      <div style="font-size:11px; color:#aaa; text-transform:uppercase;">Hit Time (UTC)</div>
      <div class="hit-utc">${tStr}</div>
      <div class="countdown">${diffSec}s remaining</div>
    `;
  }
}

function clearLane(i) {
  const mInput = document.getElementById(`waitM-${i}`);
  const sInput = document.getElementById(`waitS-${i}`);
  if (mInput) mInput.value = '';
  if (sInput) sInput.value = '';
  targets[i] = null;
  renderOutput(i, Date.now());
}
</script>
</body>
</html>
