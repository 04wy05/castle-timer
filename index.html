<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王城战 UTC 撞击报时器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #f0f0f0; padding: 15px; margin: 0; }
  .card { max-width: 460px; margin: 10px auto; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
  h2 { margin: 0 0 15px 0; text-align: center; color: #ff9800; font-size: 20px; }
  
  .utc-bar { background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #444; }
  .utc-time { font-size: 24px; font-weight: bold; color: #4caf50; font-family: monospace; }
  
  .form-group { margin-bottom: 15px; background: #252525; padding: 12px; border-radius: 8px; }
  .form-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
  .inputs { display: flex; align-items: center; gap: 8px; }
  input { width: 75px; height: 38px; font-size: 18px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #333; color: #fff; }
  
  button { width: 100%; height: 46px; font-size: 18px; font-weight: bold; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
  button:active { background: #d35400; }
  
  .result { margin-top: 20px; padding: 16px; background: #2c1a1a; border-radius: 8px; border: 1px solid #ff5252; text-align: center; display: none; }
  .result-title { font-size: 14px; color: #aaa; }
  .time-display { font-size: 32px; color: #ff5252; font-weight: bold; font-family: monospace; margin: 8px 0; }
  .tips { font-size: 14px; color: #ffcc80; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h2>🏰 王城战 UTC 报时雷达</h2>

  <div class="utc-bar">
    <div style="font-size: 12px; color: #888;">当前游戏服务器时间 (UTC)</div>
    <div class="utc-time" id="currentUtc">--:--:--</div>
  </div>

  <div class="form-group">
    <label>1. 敌方集结等待剩余（还在等队友塞兵）：</label>
    <div class="inputs">
      <input type="number" id="waitM" placeholder="分" value="0" min="0"> 分
      <input type="number" id="waitS" placeholder="秒" value="0" min="0" max="59"> 秒
    </div>
  </div>

  <div class="form-group">
    <label>2. 敌方集结行军耗时（已经在路上就只填这里）：</label>
    <div class="inputs">
      <input type="number" id="marchM" placeholder="分" value="0" min="0"> 分
      <input type="number" id="marchS" placeholder="秒" value="45" min="0" max="59"> 秒
    </div>
  </div>

  <button onclick="calculate()">计算撞击时间点</button>

  <div class="result" id="res">
    <div class="result-title">🎯 敌方精确撞击王城时间 (UTC)：</div>
    <div class="time-display" id="hitTime">--:--:--</div>
    <div class="tips" id="broadcastText"></div>
  </div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

// 实时更新当前 UTC 时间
function updateUtcClock() {
  const now = new Date();
  const h = pad(now.getUTCHours());
  const m = pad(now.getUTCMinutes());
  const s = pad(now.getUTCSeconds());
  document.getElementById('currentUtc').innerText = `${h}:${m}:${s}`;
}
setInterval(updateUtcClock, 1000);
updateUtcClock();

function calculate() {
  const waitM = parseInt(document.getElementById('waitM').value) || 0;
  const waitS = parseInt(document.getElementById('waitS').value) || 0;
  const marchM = parseInt(document.getElementById('marchM').value) || 0;
  const marchS = parseInt(document.getElementById('marchS').value) || 0;

  const totalWaitSec = waitM * 60 + waitS;
  const totalMarchSec = marchM * 60 + marchS;
  const totalSec = totalWaitSec + totalMarchSec;

  const now = new Date();
  const hitDate = new Date(now.getTime() + totalSec * 1000);

  const hitH = pad(hitDate.getUTCHours());
  const hitM = pad(hitDate.getUTCMinutes());
  const hitS = pad(hitDate.getUTCSeconds());
  const hitString = `${hitH}:${hitM}:${hitS}`;

  document.getElementById('res').style.display = 'block';
  document.getElementById('hitTime').innerText = hitString;
  document.getElementById('broadcastText').innerHTML = `
    📢 <strong>语音/打字直接播报：</strong><br>
    “王城 <strong>${hitString}</strong> 撞，补防看好自己的行军时间提前进！”
  `;
}
</script>
</body>
</html>
