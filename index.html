<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Rally & Refill Radar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #121212; color: #fff; padding: 12px; margin: 0; }
  
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #333; flex-wrap: wrap; gap: 10px; }
  .utc-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .utc-clock { font-size: 26px; font-weight: bold; color: #00e676; letter-spacing: 1px; }

  .global-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn-global { border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: #fff; transition: background 0.2s; }
  .btn-mode { background: #6a1b9a; border: 1px solid #ab47bc; }
  .btn-mode:hover { background: #7b1fa2; }
  .btn-mode.offset-active { background: #e65100; border-color: #ff9800; }
  .btn-global-add { background: #1976d2; }
  .btn-global-add:hover { background: #1e88e5; }
  .btn-global-copy { background: #2e7d32; }
  .btn-global-copy:hover { background: #388e3c; }
  .btn-global-copy.copied { background: #00838f; }
  .btn-global-reset { background: #424242; }
  .btn-global-reset:hover { background: #616161; }

  .section-title { font-size: 14px; font-weight: bold; color: #90caf9; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 10px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .mode-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #2a2a2a; color: #ccc; border: 1px solid #444; text-transform: none; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .lane-card { background: #1e1e1e; border-radius: 10px; border: 2px solid #333; padding: 14px; position: relative; transition: border-color 0.2s; }
  .lane-card.danger { border-color: #ff3d00; background: #261414; }
  .lane-card.anchor-selected { border-color: #00e676; box-shadow: 0 0 10px rgba(0, 230, 118, 0.2); }

  .lane-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .lane-title-left { display: flex; align-items: center; gap: 6px; }
  .lane-title span { font-weight: bold; font-size: 15px; color: #ffb74d; }
  
  .btn-set-base { background: #333; border: 1px solid #666; color: #ffcc80; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; display: none; }
  .btn-set-base:hover { background: #444; }
  .btn-set-base.is-base { background: #ff9800; color: #000; border-color: #ffb74d; }

  .btn-remove { background: transparent; border: 1px solid #444; color: #888; padding: 2px 7px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn-remove:hover { border-color: #ff5252; color: #ff5252; }

  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #bbb; min-height: 32px; }
  .input-row input { height: 32px; font-size: 15px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }
  .input-leader { width: 150px; padding: 0 8px; text-align: left; }
  .input-num { width: 55px; text-align: center; }
  .input-gap { width: 70px; text-align: center; border-color: #ff9800 !important; background: #2b2114 !important; color: #ffcc80 !important; font-weight: bold; }

  .output-box { margin-top: 10px; padding: 10px; background: #111; border-radius: 6px; text-align: center; border: 1px dashed #444; }
  .hit-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .hit-utc { font-size: 24px; font-weight: bold; color: #ff5252; letter-spacing: 1px; margin: 2px 0; }
  .countdown { font-size: 14px; color: #ffeb3b; margin-top: 4px; font-weight: bold; }
  .status-idle { color: #666; font-size: 13px; padding: 8px 0; }

  .btn-anchor { width: 100%; margin-top: 10px; padding: 7px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #ccc; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-anchor:hover { background: #333; color: #fff; }
  .btn-anchor.active { background: #00c853; color: #000; border-color: #00e676; }

  /* Squad Refill Section */
  .refill-panel { background: #1e1e1e; border-radius: 10px; border: 1px solid #333; padding: 14px; margin-top: 8px; }
  .refill-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid #333; margin-bottom: 12px; }
  .anchor-status { font-size: 13px; color: #bbb; }
  .anchor-highlight { color: #00e676; font-weight: bold; font-size: 15px; }
  
  .offset-control { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .offset-control select { background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 13px; }

  .squad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .member-row { display: flex; align-items: center; justify-content: space-between; background: #141414; border: 1px solid #2c2c2c; padding: 8px 10px; border-radius: 6px; gap: 6px; }
  .member-row.launch-soon { border-color: #ffab00; background: #262010; }
  .member-row.launch-now { border-color: #00e676; background: #102618; }

  .member-inputs { display: flex; align-items: center; gap: 6px; }
  .m-name { width: 95px; height: 28px; font-size: 13px; padding: 0 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
  .m-march { width: 46px; height: 28px; font-size: 13px; text-align: center; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
  
  .member-result { text-align: right; min-width: 105px; }
  .launch-utc { font-size: 15px; font-weight: bold; color: #4fc3f7; }
  .launch-cd { font-size: 12px; color: #aaa; }
  .launch-cd.urgent { color: #ffab00; font-weight: bold; }
  .launch-cd.go { color: #00e676; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="utc-label">Server Time (UTC)</div>
    <div class="utc-clock" id="clock">00:00:00</div>
  </div>
  <div class="global-actions">
    <button class="btn-global btn-mode" id="btnToggleMode" onclick="toggleInputMode()">🔀 Mode: Standard (m/s)</button>
    <button class="btn-global btn-global-add" onclick="addLane()">➕ Add Rally</button>
    <button class="btn-global btn-global-copy" id="btnCopyRallies" onclick="copyAllRallies()">📋 Copy Enemy Hits</button>
    <button class="btn-global btn-global-reset" onclick="resetAllTimers()">🔄 Reset Timers</button>
  </div>
</div>

<div class="section-title">
  <span>⚔️ Enemy Rallies Incoming</span>
  <span class="mode-badge" id="modeHint">Standard Mode: Enter exact waiting time (m/s) for each rally</span>
</div>
<div class="lanes" id="lanesContainer"></div>

<div class="section-title" style="margin-top: 22px;">
  <span>🛡️ Refill Squad Dispatch (9 Members Auto-Saved)</span>
  <button class="btn-global btn-global-copy" id="btnCopySquad" onclick="copySquadSchedule()">📋 Copy Squad Launch Times</button>
</div>

<div class="refill-panel">
  <div class="refill-header">
    <div class="anchor-status" id="anchorInfo">
      Select an enemy rally above (<b>"Set Refill Anchor"</b>) to calculate teammate launch times.
    </div>
    <div class="offset-control">
      <label for="entryOffset">Enter Castle:</label>
      <select id="entryOffset" onchange="updateClock()">
        <option value="1" selected>+1s after hit</option>
        <option value="2">+2s after hit</option>
        <option value="0">0s (exact hit)</option>
      </select>
    </div>
  </div>

  <div class="squad-grid" id="squadContainer"></div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

// 'standard' | 'offset'
var inputMode = 'standard';

// 存储每个卡片状态: { id, launchTime, target }
var lanes = [];
var nextId = 1;
var baseLaneId = null;   // Offset 模式下，动态指定的“首车基准”卡片 ID
var anchorLaneId = null; // 补兵队锁定的“撞击锚点”卡片 ID

var defaultSquad = [
  { name: 'Member 1', march: '' },
  { name: 'Member 2', march: '' },
  { name: 'Member 3', march: '' },
  { name: 'Member 4', march: '' },
  { name: 'Member 5', march: '' },
  { name: 'Member 6', march: '' },
  { name: 'Member 7', march: '' },
  { name: 'Member 8', march: '' },
  { name: 'Member 9', march: '' }
];

var squadData = [];

function loadSquad() {
  try {
    var saved = localStorage.getItem('kingshot_refill_squad_v1');
    if (saved) {
      squadData = JSON.parse(saved);
    } else {
      squadData = JSON.parse(JSON.stringify(defaultSquad));
    }
  } catch (e) {
    squadData = JSON.parse(JSON.stringify(defaultSquad));
  }
  renderSquadInputs();
}

function saveSquad() {
  for (var i = 0; i < squadData.length; i++) {
    var nEl = document.getElementById('m-name-' + i);
    var mEl = document.getElementById('m-march-' + i);
    if (nEl) squadData[i].name = nEl.value;
    if (mEl) squadData[i].march = mEl.value;
  }
  try {
    localStorage.setItem('kingshot_refill_squad_v1', JSON.stringify(squadData));
  } catch (e) {}
  updateClock();
}

function renderSquadInputs() {
  var container = document.getElementById('squadContainer');
  container.innerHTML = '';
  for (var i = 0; i < squadData.length; i++) {
    var m = squadData[i];
    var row = document.createElement('div');
    row.className = 'member-row';
    row.id = 'm-row-' + i;
    row.innerHTML =
      '<div class="member-inputs">' +
        '<input type="text" class="m-name" id="m-name-' + i + '" value="' + escapeHtml(m.name) + '" placeholder="Name" oninput="saveSquad()">' +
        '<input type="number" class="m-march" id="m-march-' + i + '" value="' + escapeHtml(m.march) + '" placeholder="sec" min="1" oninput="saveSquad()">s' +
      '</div>' +
      '<div class="member-result" id="m-res-' + i + '">' +
        '<div class="launch-utc">--:--:--</div>' +
        '<div class="launch-cd">No anchor</div>' +
      '</div>';
    container.appendChild(row);
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleInputMode() {
  var btn = document.getElementById('btnToggleMode');
  var hint = document.getElementById('modeHint');

  if (inputMode === 'standard') {
    inputMode = 'offset';
    if (!baseLaneId && lanes.length > 0) {
      baseLaneId = lanes[0].id;
    }
    btn.innerText = '🔀 Mode: Offset (+Gap)';
    btn.classList.add('offset-active');
    hint.innerText = 'Offset Mode: Click "⭐ First" on whichever rally opens first, then enter +s delay on others';
  } else {
    inputMode = 'standard';
    btn.innerText = '🔀 Mode: Standard (m/s)';
    btn.classList.remove('offset-active');
    hint.innerText = 'Standard Mode: Enter exact waiting time (m/s) for each rally';
  }

  refreshLaneInputModes();
  recalcAll();
}

// 动态指定任意一张卡片作为本轮“首车基准”
function setBaseLane(id) {
  if (baseLaneId === id) return;
  baseLaneId = id;
  // 切换首车时，清理所有卡片的旧时间推算基准以便重新准确锁定
  for (var i = 0; i < lanes.length; i++) {
    lanes[i].launchTime = null;
    lanes[i].target = null;
  }
  refreshLaneInputModes();
  recalcAll();
}

function refreshLaneInputModes() {
  var baseLaneObj = baseLaneId ? getLaneObj(baseLaneId) : null;
  var baseLeaderEl = baseLaneObj ? document.getElementById('leader-' + baseLaneObj.id) : null;
  var baseName = (baseLeaderEl && baseLeaderEl.value.trim()) ? baseLeaderEl.value.trim() : 'First Rally';

  for (var i = 0; i < lanes.length; i++) {
    var id = lanes[i].id;
    var stdBox = document.getElementById('std-box-' + id);
    var gapBox = document.getElementById('gap-box-' + id);
    var rowLabel = document.getElementById('timer-label-' + id);
    var baseBtn = document.getElementById('base-btn-' + id);
    if (!stdBox || !gapBox || !rowLabel || !baseBtn) continue;

    if (inputMode === 'standard') {
      baseBtn.style.display = 'none';
      stdBox.style.display = 'inline-block';
      gapBox.style.display = 'none';
      rowLabel.innerText = 'Rally Timer (Waiting):';
    } else {
      baseBtn.style.display = 'inline-block';
      if (id === baseLaneId) {
        baseBtn.classList.add('is-base');
        baseBtn.innerText = '⭐ First (Base)';
        stdBox.style.display = 'inline-block';
        gapBox.style.display = 'none';
        rowLabel.innerText = 'Base Timer (m/s):';
      } else {
        baseBtn.classList.remove('is-base');
        baseBtn.innerText = 'Set as First';
        stdBox.style.display = 'none';
        gapBox.style.display = 'inline-block';
        rowLabel.innerText = 'Delay vs ' + baseName + ':';
      }
    }
  }
  updateLaneLabels();
}

function addLane() {
  var id = nextId++;
  lanes.push({ id: id, launchTime: null, target: null });
  if (!baseLaneId) baseLaneId = id;

  var container = document.getElementById('lanesContainer');
  var card = document.createElement('div');
  card.className = 'lane-card';
  card.id = 'card-' + id;

  card.innerHTML =
    '<div class="lane-title">' +
      '<div class="lane-title-left">' +
        '<span class="lane-label">🎯 RALLY ' + lanes.length + '</span>' +
        '<button class="btn-set-base" id="base-btn-' + id + '" onclick="setBaseLane(' + id + ')">Set as First</button>' +
      '</div>' +
      '<button class="btn-remove" onclick="removeLane(' + id + ')" title="Remove card">✖</button>' +
    '</div>' +
    '<div class="input-row">' +
      '<label>Rally Leader:</label>' +
      '<input type="text" class="input-leader" id="leader-' + id + '" placeholder="e.g. Boss" oninput="onLeaderChange()">' +
    '</div>' +
    '<div class="input-row">' +
      '<label id="timer-label-' + id + '">Rally Timer (Waiting):</label>' +
      '<div>' +
        '<span id="std-box-' + id + '">' +
          '<input type="number" class="input-num" id="waitM-' + id + '" placeholder="m" min="0" oninput="recalcAll()"> m ' +
          '<input type="number" class="input-num" id="waitS-' + id + '" placeholder="s" min="0" max="59" oninput="recalcAll()"> s' +
        '</span>' +
        '<span id="gap-box-' + id + '" style="display:none;">' +
          '+ <input type="number" class="input-gap" id="gapS-' + id + '" placeholder="sec" min="0" oninput="recalcAll()"> s' +
        '</span>' +
      '</div>' +
    '</div>' +
    '<div class="input-row">' +
      '<label>March Duration:</label>' +
      '<div>' +
        '<input type="number" class="input-num" id="marchS-' + id + '" placeholder="s" value="45" min="0" oninput="recalcAll()"> s' +
      '</div>' +
    '</div>' +
    '<div class="output-box" id="out-' + id + '">' +
      '<div class="status-idle">Awaiting time input...</div>' +
    '</div>' +
    '<button class="btn-anchor" id="anchor-btn-' + id + '" onclick="setAnchor(' + id + ')">🎯 Set Refill Anchor</button>';

  container.appendChild(card);
  refreshLaneInputModes();
}

function onLeaderChange() {
  refreshLaneInputModes();
  updateClock();
}

function removeLane(id) {
  if (lanes.length <= 1) return;
  if (anchorLaneId === id) anchorLaneId = null;
  lanes = lanes.filter(function(item) { return item.id !== id; });
  if (baseLaneId === id) {
    baseLaneId = lanes.length > 0 ? lanes[0].id : null;
  }
  var card = document.getElementById('card-' + id);
  if (card) card.remove();
  refreshLaneInputModes();
  recalcAll();
}

function updateLaneLabels() {
  var labels = document.querySelectorAll('.lane-label');
  for (var i = 0; i < labels.length; i++) {
    labels[i].innerText = '🎯 RALLY ' + (i + 1);
  }
}

function getLaneObj(id) {
  for (var i = 0; i < lanes.length; i++) {
    if (lanes[i].id === id) return lanes[i];
  }
  return null;
}

function setAnchor(id) {
  if (anchorLaneId === id) {
    anchorLaneId = null;
  } else {
    anchorLaneId = id;
  }
  updateClock();
}

function recalcAll() {
  var now = Date.now();
  var baseLaunchTime = null;

  // 第一步：先算基准车（在 Standard 模式下所有车都是独立基准；在 Offset 模式下只有 baseLaneId 是基准）
  for (var i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    var id = lane.id;
    var marchSInput = document.getElementById('marchS-' + id);
    var marchS = parseInt(marchSInput ? marchSInput.value : 45) || 0;

    if (inputMode === 'standard' || id === baseLaneId) {
      var waitMInput = document.getElementById('waitM-' + id);
      var waitSInput = document.getElementById('waitS-' + id);
      var rawM = waitMInput ? waitMInput.value.trim() : '';
      var rawS = waitSInput ? waitSInput.value.trim() : '';

      if (rawM === '' && rawS === '') {
        lane.launchTime = null;
        lane.target = null;
      } else {
        var waitM = parseInt(rawM) || 0;
        var waitS = parseInt(rawS) || 0;
        var waitTotalMs = (waitM * 60 + waitS) * 1000;

        if (document.activeElement === waitMInput || document.activeElement === waitSInput || !lane.launchTime) {
          lane.launchTime = now + waitTotalMs;
        }
        lane.target = lane.launchTime + marchS * 1000;
      }

      if (id === baseLaneId) {
        baseLaunchTime = lane.launchTime;
      }
    }
  }

  // 第二步：如果是 Offset 模式，根据首车基准计算其余所有卡片的出发与撞击时刻
  if (inputMode === 'offset') {
    for (var j = 0; j < lanes.length; j++) {
      var otherLane = lanes[j];
      var oid = otherLane.id;
      if (oid === baseLaneId) continue;

      var oMarchInput = document.getElementById('marchS-' + oid);
      var oMarchS = parseInt(oMarchInput ? oMarchInput.value : 45) || 0;
      var gapInput = document.getElementById('gapS-' + oid);
      var rawGap = gapInput ? gapInput.value.trim() : '';

      if (!baseLaunchTime || rawGap === '') {
        otherLane.launchTime = null;
        otherLane.target = null;
      } else {
        var gapSec = parseInt(rawGap) || 0;
        otherLane.launchTime = baseLaunchTime + gapSec * 1000;
        otherLane.target = otherLane.launchTime + oMarchS * 1000;
      }
    }
  }

  updateClock();
}

function updateClock() {
  var now = new Date();
  var h = pad(now.getUTCHours());
  var m = pad(now.getUTCMinutes());
  var s = pad(now.getUTCSeconds());
  var clockEl = document.getElementById('clock');
  if (clockEl) {
    clockEl.innerText = h + ':' + m + ':' + s;
  }

  var nowTime = now.getTime();
  for (var i = 0; i < lanes.length; i++) {
    renderLaneOutput(lanes[i].id, nowTime);
  }
  renderSquadCalculations(nowTime);
}

function renderLaneOutput(id, nowTime) {
  var lane = getLaneObj(id);
  var out = document.getElementById('out-' + id);
  var card = document.getElementById('card-' + id);
  var anchorBtn = document.getElementById('anchor-btn-' + id);
  if (!lane || !out || !card || !anchorBtn) return;

  if (anchorLaneId === id) {
    card.classList.add('anchor-selected');
    anchorBtn.classList.add('active');
    anchorBtn.innerText = '✅ Active Refill Anchor';
  } else {
    card.classList.remove('anchor-selected');
    anchorBtn.classList.remove('active');
    anchorBtn.innerText = '🎯 Set Refill Anchor';
  }

  var target = lane.target;
  if (!target) {
    var baseObj = baseLaneId ? getLaneObj(baseLaneId) : null;
    var idleMsg = (inputMode === 'offset' && id !== baseLaneId && (!baseObj || !baseObj.launchTime))
      ? 'Set Base Rally timer first...'
      : 'Awaiting time input...';
    out.innerHTML = '<div class="status-idle">' + idleMsg + '</div>';
    card.classList.remove('danger');
    return;
  }

  var diffSec = Math.round((target - nowTime) / 1000);
  var targetDate = new Date(target);
  var tStr = pad(targetDate.getUTCHours()) + ':' + pad(targetDate.getUTCMinutes()) + ':' + pad(targetDate.getUTCSeconds());

  if (diffSec <= 0) {
    out.innerHTML = '<div style="color:#ff5252; font-weight:bold; font-size:16px;">💥 HIT CASTLE (' + tStr + ')</div>';
    card.classList.remove('danger');
  } else {
    if (diffSec <= 15) {
      card.classList.add('danger');
    } else {
      card.classList.remove('danger');
    }
    out.innerHTML = '<div class="hit-label">Hits Castle (UTC)</div><div class="hit-utc">' + tStr + '</div><div class="countdown">' + diffSec + 's remaining</div>';
  }
}

function renderSquadCalculations(nowTime) {
  var infoEl = document.getElementById('anchorInfo');
  var offsetSec = parseInt(document.getElementById('entryOffset').value) || 0;
  var anchorLane = anchorLaneId ? getLaneObj(anchorLaneId) : null;

  if (!anchorLane || !anchorLane.target) {
    infoEl.innerHTML = 'Select an active enemy rally above (<b>"Set Refill Anchor"</b>) to calculate launch times.';
    for (var i = 0; i < squadData.length; i++) {
      var resEl = document.getElementById('m-res-' + i);
      var rowEl = document.getElementById('m-row-' + i);
      if (resEl) resEl.innerHTML = '<div class="launch-utc">--:--:--</div><div class="launch-cd">Waiting anchor</div>';
      if (rowEl) {
        rowEl.classList.remove('launch-soon');
        rowEl.classList.remove('launch-now');
      }
    }
    return;
  }

  var leaderEl = document.getElementById('leader-' + anchorLane.id);
  var leaderName = (leaderEl && leaderEl.value.trim()) ? leaderEl.value.trim() : 'Selected Rally';
  var castleEntryTime = anchorLane.target + offsetSec * 1000;
  var entryDate = new Date(castleEntryTime);
  var entryStr = pad(entryDate.getUTCHours()) + ':' + pad(entryDate.getUTCMinutes()) + ':' + pad(entryDate.getUTCSeconds());

  infoEl.innerHTML = 'Refilling after <b>[' + escapeHtml(leaderName) + ']</b> &rarr; Target Castle Entry: <span class="anchor-highlight">UTC ' + entryStr + '</span>';

  for (var i = 0; i < squadData.length; i++) {
    var marchSec = parseInt(squadData[i].march);
    var resEl = document.getElementById('m-res-' + i);
    var rowEl = document.getElementById('m-row-' + i);
    if (!resEl || !rowEl) continue;

    rowEl.classList.remove('launch-soon');
    rowEl.classList.remove('launch-now');

    if (isNaN(marchSec) || marchSec <= 0) {
      resEl.innerHTML = '<div class="launch-utc">--:--:--</div><div class="launch-cd">Set march sec</div>';
      continue;
    }

    var launchTime = castleEntryTime - marchSec * 1000;
    var launchDate = new Date(launchTime);
    var lStr = pad(launchDate.getUTCHours()) + ':' + pad(launchDate.getUTCMinutes()) + ':' + pad(launchDate.getUTCSeconds());
    var secUntilLaunch = Math.round((launchTime - nowTime) / 1000);

    if (secUntilLaunch > 5) {
      resEl.innerHTML = '<div class="launch-utc">' + lStr + '</div><div class="launch-cd">Send in ' + secUntilLaunch + 's</div>';
    } else if (secUntilLaunch > 0) {
      rowEl.classList.add('launch-soon');
      resEl.innerHTML = '<div class="launch-utc">' + lStr + '</div><div class="launch-cd urgent">READY (' + secUntilLaunch + 's)!</div>';
    } else if (secUntilLaunch >= -2) {
      rowEl.classList.add('launch-now');
      resEl.innerHTML = '<div class="launch-utc">' + lStr + '</div><div class="launch-cd go">🚀 LAUNCH NOW!</div>';
    } else {
      resEl.innerHTML = '<div class="launch-utc" style="color:#666;">' + lStr + '</div><div class="launch-cd" style="color:#666;">Passed</div>';
    }
  }
}

function resetAllTimers() {
  anchorLaneId = null;
  for (var i = 0; i < lanes.length; i++) {
    var id = lanes[i].id;
    var mEl = document.getElementById('waitM-' + id);
    var sEl = document.getElementById('waitS-' + id);
    var gEl = document.getElementById('gapS-' + id);
    if (mEl) mEl.value = '';
    if (sEl) sEl.value = '';
    if (gEl) gEl.value = '';
    lanes[i].launchTime = null;
    lanes[i].target = null;
  }
  updateClock();
}

function copyAllRallies() {
  var activeList = [];
  for (var i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    if (lane.target) {
      var leaderEl = document.getElementById('leader-' + lane.id);
      var leaderName = (leaderEl && leaderEl.value.trim()) ? leaderEl.value.trim() : 'Rally ' + (i + 1);
      activeList.push({ leader: leaderName, target: lane.target });
    }
  }
  if (activeList.length === 0) return;

  activeList.sort(function(a, b) { return a.target - b.target; });

  var lines = activeList.map(function(item) {
    var d = new Date(item.target);
    var tStr = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    return '[' + item.leader + '] Hits Castle at UTC ' + tStr;
  });

  copyText(lines.join('\n'), 'btnCopyRallies', '📋 Copy Enemy Hits');
}

function copySquadSchedule() {
  var anchorLane = anchorLaneId ? getLaneObj(anchorLaneId) : null;
  if (!anchorLane || !anchorLane.target) return;

  var offsetSec = parseInt(document.getElementById('entryOffset').value) || 0;
  var castleEntryTime = anchorLane.target + offsetSec * 1000;
  var entryDate = new Date(castleEntryTime);
  var entryStr = pad(entryDate.getUTCHours()) + ':' + pad(entryDate.getUTCMinutes()) + ':' + pad(entryDate.getUTCSeconds());

  var leaderEl = document.getElementById('leader-' + anchorLane.id);
  var leaderName = (leaderEl && leaderEl.value.trim()) ? leaderEl.value.trim() : 'Target Rally';

  var lines = ['🛡️ REFILL AFTER [' + leaderName + '] (Enter Castle at UTC ' + entryStr + '):'];

  for (var i = 0; i < squadData.length; i++) {
    var marchSec = parseInt(squadData[i].march);
    if (!isNaN(marchSec) && marchSec > 0) {
      var mName = squadData[i].name.trim() || ('Member ' + (i + 1));
      var launchTime = castleEntryTime - marchSec * 1000;
      var lDate = new Date(launchTime);
      var lStr = pad(lDate.getUTCHours()) + ':' + pad(lDate.getUTCMinutes()) + ':' + pad(lDate.getUTCSeconds());
      lines.push('• ' + mName + ' (' + marchSec + 's): Launch at UTC ' + lStr);
    }
  }

  if (lines.length <= 1) return;
  copyText(lines.join('\n'), 'btnCopySquad', '📋 Copy Squad Launch Times');
}

function copyText(text, btnId, defaultText) {
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById(btnId);
    if (btn) {
      btn.innerText = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerText = defaultText;
        btn.classList.remove('copied');
      }, 2000);
    }
  });
}

window.addEventListener('DOMContentLoaded', function() {
  loadSquad();
  addLane();
  addLane();
  addLane();
  updateClock();
  setInterval(updateClock, 1000);
});
</script>
