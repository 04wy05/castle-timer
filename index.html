<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王城精准报时器</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #181818; color: #eee; padding: 15px; margin: 0; }
  .card { max-width: 460px; margin: 10px auto; background: #242424; padding: 20px; border-radius: 10px; }
  h2 { margin: 0 0 15px 0; text-align: center; color: #ff9800; font-size: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  label { font-size: 15px; color: #bbb; }
  input { width: 90px; height: 36px; font-size: 18px; text-align: center; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; }
  button { width: 100%; height: 44px; font-size: 17px; font-weight: bold; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px; }
  .result { margin-top: 18px; padding: 15px; background: #1a1a1a; border-radius: 8px; border-left: 4px solid #e67e22; }
  .time-huge { font-size: 28px; color: #ff5252; font-weight: bold; font-family: monospace; }
  .sub-text { font-size: 15px; margin-top: 8px; color: #4caf50; }
</style>
</head>
<body>
<div class="card">
  <h2>🏰 王城精确撞击报时</h2>

  <div class="row">
    <label>敌方 Rally 剩余时间：</label>
    <div>
      <input type="number" id="m" placeholder="分" value="0" min="0"> 分
      <input type="number" id="s" placeholder="秒" value="45" min="0" max="59"> 秒
    </div>
  </div>

  <div class="row">
    <label>你自己的行军耗时(秒)：</label>
    <input type="number" id="myMarch" placeholder="秒" value="6" min="1">
  </div>

  <button onclick="calculate()">计算时间点</button>

  <div class="result" id="res" style="display:none;">
    <div>🎯 <strong>敌方精确撞击时间：</strong></div>
    <div class="time-huge" id="hitTime">--:--:--</div>
    <div class="sub-text" id="actionTime"></div>
  </div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

function format(d) {
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function calculate() {
  const m = parseInt(document.getElementById('m').value) || 0;
  const s = parseInt(document.getElementById('s').value) || 0;
  const myMarch = parseInt(document.getElementById('myMarch').value) || 0;

  const now = new Date();
  const totalRallySeconds = m * 60 + s;

  // 撞击时刻
  const hitDate = new Date(now.getTime() + totalRallySeconds * 1000);
  // 自己需要发兵的时刻
  const sendDate = new Date(hitDate.getTime() - myMarch * 1000);

  document.getElementById('res').style.display = 'block';
  document.getElementById('hitTime').innerText = format(hitDate);
  document.getElementById('actionTime').innerHTML = `
    👉 你需要在 <strong>${format(sendDate)}</strong> 点击发兵（提前 ${myMarch} 秒）
  `;
}
</script>
</body>
</html>
