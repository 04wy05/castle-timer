<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王城战三路集结雷达</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #121212; color: #fff; padding: 12px; margin: 0; }
  
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
  .utc-label { font-size: 14px; color: #aaa; }
  .utc-clock { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 1px; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .lane-card { background: #1e1e1e; border-radius: 10px; border: 1px solid #333; padding: 14px; position: relative; }
  .lane-card.danger { border-color: #ff3d00; background: #261414; }

  .lane-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-title span { font-weight: bold; font-size: 16px; color: #ffb74d; }
  .btn-clear { background: #424242; border: none; color: #bbb; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #bbb; }
  .input-row input { width: 65px; height: 32px; font-size: 16px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }

  .output-box { margin-top: 12px; padding: 10px; background: #111; border-radius: 6px; text-align: center; border: 1px dashed #444; }
  .hit-utc { font-size: 22px; font-weight: bold; color: #ff5252; letter-spacing: 1px; }
  .countdown { font-size: 16px; color: #ffeb3b; margin-top: 4px; font-weight: bold; }
  .status-idle { color: #666; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="utc-label">游戏服务器时间 (UTC)</div>
    <div class="utc-clock" id="clock">--:--:--</div>
  </div>
  <div style="font-size: 12px; color: #888;">输入数值即自动同步计算</div>
</div>

<div class="lanes">
  <!-- 窗口 1 -->
  <div class="lane-card" id="card-0">
    <div class="lane-title">
      <span>🎯 集结 1 (车头 A)</span>
      <button class="btn-clear" onclick="clearLane(0)">清空重置</button>
    </div>
    <div class="input-row">
      <label>集结倒计时(等待期):</label>
      <div>
        <input type="number" id="waitM-0" placeholder="分" min="0" oninput="recalc(0)"> 分
        <input type="number" id="waitS-0" placeholder="秒" min="0" max="59" oninput="recalc(0)"> 秒
      </div>
    </div>
    <div class="input-row">
      <label>固定行军耗时(路程):</label>
      <div>
        <input type="number" id="marchS-0" placeholder="秒" value="45" min="0" oninput="recalc(0)"> 秒
      </div>
    </div>
    <div class="output-box" id="out-0">
      <div class="status-idle">等待输入时间...</div>
    </div>
  </div>

  <!-- 窗口 2 -->
  <div class="lane-card" id="card-1">
    <div class="lane-title">
      <span>🎯 集结 2 (车头 B)</span>
      <button class="btn-clear" onclick="clearLane(1)">清空重置</button>
    </div>
    <div class="input-row">
      <label>集结倒计时(等待期):</label>
      <div>
        <input type="number" id="waitM-1" placeholder="分" min="0" oninput="recalc(1)"> 分
        <input type="number" id="waitS-1" placeholder="秒" min="0" max="59" oninput="recalc(1)"> 秒
      </div>
    </div>
    <div class="input-row">
      <label>固定行军耗时(路程):</label>
      <div>
        <input type="number" id="marchS-1" placeholder="秒" value="45" min="0" oninput="recalc(1)"> 秒
      </div>
    </div>
    <div class="output-box" id="out-1">
      <div class="status-idle">等待输入时间...</div>
    </div>
  </div>

  <!-- 窗口 3 -->
  <div class="lane-card" id="card-2">
    <div class="lane-title">
      <span>🎯 集结 3 (车头 C)</span>
      <button class="btn-clear" onclick="clearLane(2)">清空重置</button>
    </div>
    <div class="input-row">
      <label>集结倒计时(等待期):</label>
      <div>
        <input type="number" id="waitM-2" placeholder="分" min="0" oninput="recalc(2)"> 分
        <input type="number" id="waitS-2" placeholder="秒" min="0" max="59" oninput="recalc(2)"> 秒
      </div>
    </div>
    <div class="input-row">
      <label>固定行军耗时(路程):</label>
      <div>
        <input type="number" id="marchS-2" placeholder="秒" value="45" min="0" oninput="recalc(2)"> 秒
      </div>
    </div>
    <div class="output-box" id="out-2">
      <div class="status-idle">等待输入时间...</div>
    </div>
  </div>
</div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

// 存储三个窗口的绝对撞击时间戳 (毫秒)
const targets = [null, null, null];

function updateClock() {
  const now = new Date();
  const h = pad(now.getUTCHours());
  const m = pad(now.getUTCMinutes());
  const s = pad(now.getUTCSeconds());
  document.getElementById('clock').innerText = `${h}:${m}:${s}`;

  // 刷新三个卡片的倒计时
  for (let i = 0; i < 3; i++) {
    renderOutput(i, now.getTime());
  }
}
setInterval(updateClock, 1000);
updateClock();

// 只要输入数字，立即锁定目标时间，消灭按键延迟
function recalc(i) {
  const waitM = parseInt(document.getElementById(`waitM-${i}`).value) || 0;
  const waitS = parseInt(document.getElementById(`waitS-${i}`).value) || 0;
  const marchS = parseInt(document.getElementById(`marchS-${i}`).value) || 0;

  const totalSec = waitM * 60 + waitS + marchS;
  if (totalSec <= 0) {
    targets[i] = null;
  } else {
    // 立即以当前系统时间推算目标时刻并固定
    targets[i] = Date.now() + totalSec * 1000;
  }
  renderOutput(i, Date.now());
}

function renderOutput(i, nowTime) {
  const out = document.getElementById(`out-${i}`);
  const card = document.getElementById(`card-${i}`);
  const target = targets[i];

  if (!target) {
    out.innerHTML = `<div class="status-idle">等待输入时间...</div>`;
    card.classList.remove('danger');
    return;
  }

  const diffSec = Math.round((target - nowTime) / 1000);
  const targetDate = new Date(target);
  const tStr = `${pad(targetDate.getUTCHours())}:${pad(targetDate.getUTCMinutes())}:${pad(targetDate.getUTCSeconds())}`;

  if (diffSec <= 0) {
    out.innerHTML = `<div style="color:#ff5252; font-weight:bold; font-size:18px;">💥 已撞击 (${tStr})</div>`;
    card.classList.remove('danger');
  } else {
    // 剩余不到15秒时高亮警报
    if (diffSec <= 15) {
      card.classList.add('danger');
    } else {
      card.classList.remove('danger');
    }
    out.innerHTML = `
      <div style="font-size:12px; color:#aaa;">撞击时间 (UTC)</div>
      <div class="hit-utc">${tStr}</div>
      <div class="countdown">剩 ${diffSec} 秒撞击</div>
    `;
  }
}

function clearLane(i) {
  document.getElementById(`waitM-${i}`).value = '';
  document.getElementById(`waitS-${i}`).value = '';
  targets[i] = null;
  renderOutput(i, Date.now());
}
</script>
</body>
</html>
