<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Rally Radar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #121212; color: #fff; padding: 12px; margin: 0; }
  
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; flex-wrap: wrap; gap: 10px; }
  .utc-label { font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .utc-clock { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 1px; }

  .global-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-global { border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; color: #fff; }
  .btn-global-add { background: #1976d2; }
  .btn-global-add:hover { background: #1e88e5; }
  .btn-global-copy { background: #2e7d32; }
  .btn-global-copy:hover { background: #388e3c; }
  .btn-global-copy.copied { background: #00838f; }
  .btn-global-reset { background: #424242; }
  .btn-global-reset:hover { background: #616161; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .lane-card { background: #1e1e1e; border-radius: 10px; border: 1px solid #333; padding: 14px; position: relative; }
  .lane-card.danger { border-color: #ff3d00; background: #261414; }

  .lane-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-title span { font-weight: bold; font-size: 15px; color: #ffb74d; }
  .btn-remove { background: transparent; border: 1px solid #444; color: #888; padding: 2px 7px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn-remove:hover { border-color: #ff5252; color: #ff5252; }

  .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #bbb; }
  .input-row input { height: 32px; font-size: 15px; border-radius: 4px; border: 1px solid #555; background: #2a2a2a; color: #fff; }
  .input-leader { width: 150px; padding: 0 8px; text-align: left; }
  .input-num { width: 55px; text-align: center; }

  .output-box { margin-top: 12px; padding: 10px; background: #111; border-radius: 6px; text-align: center; border: 1px dashed #444; }
  .hit-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .hit-utc { font-size: 24px; font-weight: bold; color: #ff5252; letter-spacing: 1px; margin: 2px 0; }
  .countdown { font-size: 15px; color: #ffeb3b; margin-top: 4px; font-weight: bold; }
  .status-idle { color: #666; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="utc-label">Server Time (UTC)</div>
    <div class="utc-clock" id="clock">00:00:00</div>
  </div>
  <div class="global-actions">
    <button class="btn-global btn-global-add" onclick="addLane()">➕ Add Rally</button>
    <button class="btn-global btn-global-copy" id="btnCopyAll" onclick="copyAllOutcomes()">📋 Copy All Outcomes</button>
    <button class="btn-global btn-global-reset" onclick="resetAllTimers()">🔄 Reset Timers</button>
  </div>
</div>

<div class="lanes" id="lanesContainer"></div>

<script>
function pad(n) { return n < 10 ? '0' + n : n; }

// 存储每个卡片的独立状态 { id, target }
var lanes = [];
var nextId = 1;

function addLane() {
  var id = nextId++;
  lanes.push({ id: id, target: null });

  var container = document.getElementById('lanesContainer');
  var card = document.createElement('div');
  card.className = 'lane-card';
  card.id = 'card-' + id;

  card.innerHTML =
    '<div class="lane-title">' +
      '<span class="lane-label">🎯 RALLY ' + lanes.length + '</span>' +
      '<button class="btn-remove" onclick="removeLane(' + id + ')" title="Remove card">✖</button>' +
    '</div>' +
    '<div class="input-row">' +
      '<label>Rally Leader:</label>' +
      '<input type="text" class="input-leader" id="leader-' + id + '" placeholder="e.g. Boss" oninput="recalc(' + id + ')">' +
    '</div>' +
    '<div class="input-row">' +
      '<label>Rally Timer (Waiting):</label>' +
      '<div>' +
        '<input type="number" class="input-num" id="waitM-' + id + '" placeholder="m" min="0" oninput="recalc(' + id + ')"> m ' +
        '<input type="number" class="input-num" id="waitS-' + id + '" placeholder="s" min="0" max="59" oninput="recalc(' + id + ')"> s' +
      '</div>' +
    '</div>' +
    '<div class="input-row">' +
      '<label>March Duration:</label>' +
      '<div>' +
        '<input type="number" class="input-num" id="marchS-' + id + '" placeholder="s" value="45" min="0" oninput="recalc(' + id + ')"> s' +
      '</div>' +
    '</div>' +
    '<div class="output-box" id="out-' + id + '">' +
      '<div class="status-idle">Awaiting time input...</div>' +
    '</div>';

  container.appendChild(card);
  updateLaneLabels();
}

function removeLane(id) {
  if (lanes.length <= 1) return; // 至少保留1张卡片
  lanes = lanes.filter(function(item) { return item.id !== id; });
  var card = document.getElementById('card-' + id);
  if (card) card.remove();
  updateLaneLabels();
}

function updateLaneLabels() {
  var labels = document.querySelectorAll('.lane-label');
  for (var i = 0; i < labels.length; i++) {
    labels[i].innerText = '🎯 RALLY ' + (i + 1);
  }
}

function getLaneObj(id) {
  for (var i = 0; i < lanes.length; i++) {
    if (lanes[i].id === id) return lanes[i];
  }
  return null;
}

function updateClock() {
  var now = new Date();
  var h = pad(now.getUTCHours());
  var m = pad(now.getUTCMinutes());
  var s = pad(now.getUTCSeconds());
  var clockEl = document.getElementById('clock');
  if (clockEl) {
    clockEl.innerText = h + ':' + m + ':' + s;
  }

  var nowTime = now.getTime();
  for (var i = 0; i < lanes.length; i++) {
    renderOutput(lanes[i].id, nowTime);
  }
}

function recalc(id) {
  var lane = getLaneObj(id);
  if (!lane) return;

  var waitMInput = document.getElementById('waitM-' + id);
  var waitSInput = document.getElementById('waitS-' + id);
  var marchSInput = document.getElementById('marchS-' + id);

  var rawM = waitMInput ? waitMInput.value.trim() : '';
  var rawS = waitSInput ? waitSInput.value.trim() : '';

  if (rawM === '' && rawS === '') {
    lane.target = null;
  } else {
    var waitM = parseInt(rawM) || 0;
    var waitS = parseInt(rawS) || 0;
    var marchS = parseInt(marchSInput ? marchSInput.value : 45) || 0;
    var totalSec = waitM * 60 + waitS + marchS;
    lane.target = Date.now() + totalSec * 1000;
  }
  renderOutput(id, Date.now());
}

function renderOutput(id, nowTime) {
  var lane = getLaneObj(id);
  var out = document.getElementById('out-' + id);
  var card = document.getElementById('card-' + id);
  if (!lane || !out || !card) return;

  var target = lane.target;
  if (!target) {
    out.innerHTML = '<div class="status-idle">Awaiting time input...</div>';
    card.classList.remove('danger');
    return;
  }

  var diffSec = Math.round((target - nowTime) / 1000);
  var targetDate = new Date(target);
  var tStr = pad(targetDate.getUTCHours()) + ':' + pad(targetDate.getUTCMinutes()) + ':' + pad(targetDate.getUTCSeconds());

  if (diffSec <= 0) {
    out.innerHTML = '<div style="color:#ff5252; font-weight:bold; font-size:16px;">💥 HIT CASTLE (' + tStr + ')</div>';
    card.classList.remove('danger');
  } else {
    if (diffSec <= 15) {
      card.classList.add('danger');
    } else {
      card.classList.remove('danger');
    }
    out.innerHTML = '<div class="hit-label">Hits Castle (UTC)</div><div class="hit-utc">' + tStr + '</div><div class="countdown">' + diffSec + 's remaining</div>';
  }
}

function resetAllTimers() {
  for (var i = 0; i < lanes.length; i++) {
    var id = lanes[i].id;
    var mEl = document.getElementById('waitM-' + id);
    var sEl = document.getElementById('waitS-' + id);
    if (mEl) mEl.value = '';
    if (sEl) sEl.value = '';
    lanes[i].target = null;
    renderOutput(id, Date.now());
  }
}

function copyAllOutcomes() {
  var activeList = [];
  for (var i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    if (lane.target) {
      var leaderEl = document.getElementById('leader-' + lane.id);
      var leaderName = (leaderEl && leaderEl.value.trim()) ? leaderEl.value.trim() : 'Rally ' + (i + 1);
      activeList.push({
        leader: leaderName,
        target: lane.target
      });
    }
  }

  if (activeList.length === 0) return;

  // 按撞击时间从早到晚自动排序，方便联盟看先后波次
  activeList.sort(function(a, b) { return a.target - b.target; });

  var lines = activeList.map(function(item) {
    var d = new Date(item.target);
    var tStr = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    return '[' + item.leader + '] Hits Castle at UTC ' + tStr;
  });

  var textToCopy = lines.join('\n');
  navigator.clipboard.writeText(textToCopy).then(function() {
    var btn = document.getElementById('btnCopyAll');
    if (btn) {
      btn.innerText = '✅ Copied All (' + lines.length + ')!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerText = '📋 Copy All Outcomes';
        btn.classList.remove('copied');
      }, 2000);
    }
  });
}

// 初始化默认创建 3 张集结卡片并启动时钟
window.addEventListener('DOMContentLoaded', function() {
  addLane();
  addLane();
  addLane();
  updateClock();
  setInterval(updateClock, 1000);
});
</script>
</body>
</html>
